name: smart_tv
description: "Futuristic IPTV & Smart TV Player for Android TV & Mobile"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  video_player: ^2.8.6
  chewie: ^1.8.1
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  file_picker: ^8.0.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
